
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پرزنتیشن جامع راهکارهای سازمانی و اعتباری اوانو</title>

  <meta
    name="description"
    content="پرزنتیشن تعاملی راهکارهای سازمانی، اعتباری و رفاهی اوانو."
  >

  <meta name="theme-color" content="#00D4B4">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:title" content="پرزنتیشن جامع راهکارهای سازمانی و اعتباری اوانو">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="assets/images/logos/partners/ewano.svg"
  >

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/slides.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <!-- پس‌زمینه -->
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- هدر -->
  <div id="headerSlot"></div>

  <!-- محتوای اصلی و اسلایدها -->
  <main
    class="stage-container"
    id="stageContainer"
    aria-live="polite"
  >
    <div
      id="slidesLoader"
      class="flex-center"
      style="min-height: 60vh; font-family: Vazirmatn, sans-serif;"
    >
      در حال بارگذاری اسلایدها...
    </div>
  </main>

  <!-- منوی کناری -->
  <div id="drawerSlot"></div>

  <!-- فوتر -->
  <div id="footerSlot"></div>

  <!-- بارگذاری اجزای صفحه -->
  <script src="js/components-loader.js" defer></script>

  <!-- بارگذاری اسلایدها -->
  <script src="js/slides-loader.js" defer></script>

  <!-- منطق ناوبری -->
  <script src="js/navigation.js" defer></script>

  <!-- ماشین‌حساب اعتبار -->
  <script src="js/calculator.js" defer></script>

  <!-- دموی تعاملی -->
  <script src="js/demo.js" defer></script>

  <!-- راه‌اندازی نهایی -->
  <script src="js/main.js" defer></script>
</body>
</html>
